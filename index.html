<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10233A">
  <title>Tréningy</title>
  <style>
    html,body{margin:0;min-height:100%;background:#EEF3F6;font-family:system-ui,-apple-system,sans-serif;color:#10233A}
    .load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .card{max-width:420px;background:#fff;padding:22px;border-radius:12px;box-shadow:0 8px 30px rgba(16,35,58,.08)}
    .card b{display:block;font-size:20px;margin-bottom:8px}
    .card span{color:#6b7f92;font-size:14px;line-height:1.5}
  </style>
</head>
<body>
  <div class="load"><div class="card"><b>Načítavam tréningový proces…</b><span>Cloud plán, história a štatistiky.</span></div></div>

  <script>
  (async () => {
    const url = 'https://nragtrsgbvrnmbwlowoi.supabase.co/functions/v1/treningy-app-cors?v=10&t=' + Date.now();
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const html = await r.text();
      if (!html.includes('<!DOCTYPE html>') || !html.includes('Tréningy')) {
        throw new Error('Cloud vrátil neplatný obsah.');
      }
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.body.innerHTML = `
        <div class="load">
          <div class="card">
            <b>Appku sa nepodarilo načítať</b>
            <span>${String(e && e.message ? e.message : e)}<br><br>Skús obnoviť stránku.</span>
          </div>
        </div>`;
    }
  })();
  </script>
</body>
</html>
