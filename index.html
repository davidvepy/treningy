<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#eef3f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tréning" />
  <meta name="description" content="Mobile-first silový tréningový tracker." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>Tréning</title>
  <link rel="stylesheet" href="./styles.css?v=34" />
</head>
<body>
  <div id="app"><div class="boot"><div class="boot-spinner"></div><div>Načítavam tréning…</div></div></div>
  <div id="toast-root" class="toast-root"></div>
  <script>
    window.__showBootError=function(message){
      var el=document.getElementById('app');
      var safe=String(message||'Neznáma chyba').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]});
      if(el) el.innerHTML='<div class="fatal"><b>Aplikácia sa nespustila.</b><p>'+safe+'</p><button onclick="location.reload()">Skúsiť znova</button></div>';
    };
    window.addEventListener('error',function(e){window.__showBootError(e.message||'JavaScript chyba');});
    window.addEventListener('unhandledrejection',function(e){window.__showBootError((e.reason&&e.reason.message)||e.reason||'Neošetrená chyba');});
    if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}).catch(function(){});}
    if('caches' in window){caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k)}))}).catch(function(){});}
  </script>
  <script src="./core.js?v=34"></script>
  <script src="./training.js?v=34"></script>
  <script src="./history.js?v=34"></script>
  <script src="./progress.js?v=34"></script>
  <script src="./profile.js?v=34"></script>
  <script src="./bootstrap.js?v=34"></script>
</body>
</html>
