<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tréningy</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tréningy">
<meta name="theme-color" content="#10233A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--ice:#EEF3F6;--deep:#10233A;--line:#1F5FBF;--center:#C8102E;--steel:#7B8FA3;--card:#FFF;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--ice);font-family:'Barlow',system-ui,sans-serif;color:var(--deep);padding-bottom:56px;}
  .wrap{max-width:560px;margin:0 auto;}

  .board{background:var(--deep);color:#fff;padding:16px 18px 0;}
  .board-top{display:flex;align-items:center;justify-content:space-between;gap:12px;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.15em;
    text-transform:uppercase;color:#8FA9C4;}
  .cloudbar{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:0;
    color:#B9CDDF;letter-spacing:.04em;text-transform:none;}
  .cloudbar .cloudmail{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cloudbar button{background:none;border:0;color:#B9CDDF;font:inherit;cursor:pointer;padding:2px 0;
    text-decoration:underline;text-underline-offset:2px;}
  .tabs{display:flex;margin-top:12px;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;min-width:62px;background:none;border:0;color:#5F7E9E;cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
    text-transform:uppercase;letter-spacing:.02em;padding:10px 9px 11px;
    border-bottom:4px solid #1C3450;transition:color .18s,border-color .18s;}
  .tab.on{color:#fff;border-bottom-color:var(--center);}
  .tab span{display:block;font-family:'Barlow',sans-serif;font-weight:500;
    font-size:9.5px;letter-spacing:0;text-transform:none;color:#7B99B8;margin-top:1px;}
  .tab.on span{color:#B9CDDF;}

  .head{padding:18px 18px 0;}
  .head h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:29px;
    line-height:1.05;margin:0;text-transform:uppercase;}
  .head .sub{font-size:13.5px;color:var(--steel);line-height:1.5;margin-top:7px;}
  .head .sub b{color:var(--deep);}
  .facts{display:flex;gap:20px;margin-top:14px;padding-top:12px;border-top:2px solid #DCE5EC;}
  .facts div .k{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--steel);}
  .facts div .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;line-height:1.15;}

  .warm{margin:16px 18px 0;background:var(--card);border-left:5px solid var(--center);
    padding:13px 14px;border-radius:3px;}
  .warm h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;
    text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;}
  .warm ul{margin:0;padding-left:17px;font-size:13.5px;line-height:1.7;color:#3E566E;}
  .warm p{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--steel);}

  .blk{margin:20px 18px 0;}
  .blk-lbl{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
  .blk-lbl h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;
    text-transform:uppercase;letter-spacing:.07em;margin:0;color:var(--line);}
  .blk-lbl .t{margin-left:auto;font-family:'JetBrains Mono',monospace;
    font-size:11px;font-weight:700;color:var(--steel);}
  .blk-lbl::after{content:"";flex:0;}

  .ss{border:2px solid var(--center);border-radius:4px;padding:2px;background:#FDF2F0;}
  .ss-tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
    letter-spacing:.13em;text-transform:uppercase;color:var(--center);
    padding:6px 10px 4px;}

  .ex{background:var(--card);border-radius:3px;border-left:5px solid var(--line);
    overflow:hidden;margin-bottom:7px;}
  .ss .ex{border-left-color:var(--center);margin-bottom:3px;}
  .ss .ex:last-child{margin-bottom:2px;}
  .ex.key{border-left-color:var(--center);}
  .ex-head{display:flex;align-items:flex-start;gap:11px;padding:12px 13px;cursor:pointer;}
  .num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;
    color:#B4C4D2;flex:0 0 auto;padding-top:4px;}
  .ex.key .num{color:var(--center);}
  .ex-title{flex:1;min-width:0;}
  .ex-title .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:19.5px;line-height:1.12;}
  .ex-title .alt{font-size:12px;color:var(--steel);font-style:italic;margin-top:1px;}
  .ex-title .sets{font-family:'JetBrains Mono',monospace;font-size:12px;
    color:var(--center);font-weight:700;margin-top:4px;}
  .chev{flex:0 0 auto;color:#B4C4D2;padding-top:6px;transition:transform .2s;}
  .ex.open .chev{transform:rotate(180deg);}

  .ex-body{display:none;padding:0 13px 13px 13px;}
  .ex.open .ex-body{display:block;}
  .fld{margin-top:10px;}
  .fld .k{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--steel);margin-bottom:3px;}
  .fld .v{font-size:14px;line-height:1.55;color:#2A4056;}

  /* --- piktogramy a zoštíhlená karta --- */
  .piksvg{width:100%;height:100%;color:#12293E;}
  .pikmini{flex:0 0 auto;width:34px;height:34px;padding:4px;background:#F2F6FA;border-radius:4px;}
  .ex.open .pikmini{color:#2E7D52;}
  .pikrow{display:flex;gap:12px;padding:2px 2px 12px;align-items:flex-start;}
  .pikbig{flex:0 0 auto;width:76px;height:76px;padding:8px;background:#F2F6FA;border-radius:6px;}
  .pikinfo{flex:1;min-width:0;padding-top:2px;}
  .ako{font-family:'Barlow',sans-serif;font-size:13.5px;line-height:1.48;color:#22384E;}
  .chyba{font-family:'Barlow',sans-serif;font-size:12.5px;line-height:1.4;color:#8A4B00;margin-top:7px;}
  .ytlink{display:inline-block;margin-top:8px;font-family:'Barlow',sans-serif;font-weight:600;
    font-size:12.5px;color:#1F5FBF;text-decoration:none;}
  .swline{font-family:'Barlow',sans-serif;font-size:12.5px;color:#6C8AA6;padding:2px 2px 10px;line-height:1.4;}
  .swline b{color:#4A6B87;}
  .fld.next .k .tr{float:right;font-family:'Barlow',sans-serif;font-weight:600;font-size:11px;
    color:#4A6B87;text-transform:none;letter-spacing:0;}
  .log .last{font-size:12px;color:#7B99B8;padding:8px 2px 0;line-height:1.5;}
  .log .last b{color:#4A6B87;}
  .log .last .pdel{background:none;border:0;color:#B23A48;font-size:11px;cursor:pointer;
    padding:0;margin-left:8px;text-decoration:underline;font-family:'Barlow',sans-serif;}
  .log-row{display:flex;gap:6px;align-items:center;}
  .zoz{padding:0 2px;}
  .zr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    padding:11px 4px;border-bottom:1px solid #E7EDF3;}
  .zr:last-child{border-bottom:0;}
  .zn{font-family:'Barlow',sans-serif;font-size:14.5px;color:#22384E;flex:1;line-height:1.25;}
  .zv{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;
    color:#0F2438;text-align:right;white-space:nowrap;}
  .zv em{display:block;font-family:'Barlow',sans-serif;font-weight:400;font-style:normal;
    font-size:11px;color:#7B99B8;margin-top:1px;}
  .zr-empty .zn{color:#8FA6BB;}
  .zr-empty .zv{color:#C3D0DB;font-size:15px;}

  /* --- Dnes --- */
  .dr{display:flex;align-items:center;gap:11px;padding:13px 6px;border-bottom:1px solid #E7EDF3;}
  .dr:last-child{border-bottom:0;}
  .dr.klik{cursor:pointer;}
  .dr.dnes{background:#EAF4EE;margin:0 -6px;padding-left:12px;padding-right:12px;border-radius:3px;}
  .dd{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
    text-transform:uppercase;letter-spacing:.04em;color:#5F7E9E;width:82px;flex:0 0 82px;line-height:1.15;}
  .dr.dnes .dd{color:#2E7D52;}
  .dd span{display:block;font-family:'Barlow',sans-serif;font-weight:600;font-size:10px;
    letter-spacing:.06em;color:#2E7D52;text-transform:uppercase;}
  .dt{flex:1;}
  .dt b{display:block;font-family:'Barlow',sans-serif;font-weight:600;font-size:15px;color:#12293E;}
  .dt i{display:block;font-style:normal;font-size:12.5px;color:#6C8AA6;margin-top:1px;line-height:1.35;}

  .tel{padding:4px 6px 10px;}
  .tel > div{display:flex;justify-content:space-between;align-items:baseline;
    padding:9px 0;border-bottom:1px solid #E7EDF3;}
  .tel > div:last-child{border-bottom:0;}
  .tel .k{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;
    text-transform:uppercase;letter-spacing:.05em;color:#5F7E9E;}
  .tel .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;color:#0F2438;}
  .tel .v em{font-style:normal;font-family:'Barlow',sans-serif;font-weight:600;font-size:12px;margin-left:7px;}
  .tel.prazdne{padding:14px 6px;color:#7B99B8;font-size:13.5px;}
  .telform{display:flex;gap:7px;padding:4px 6px 10px;}
  .telform input{flex:1;min-width:0;border:1px solid #CBD8E3;border-radius:3px;padding:11px 10px;
    font-family:'Barlow',sans-serif;font-size:15px;color:#12293E;background:#fff;}
  .telform button{flex:0 0 auto;background:#12293E;color:#fff;border:0;border-radius:3px;
    padding:11px 16px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
    text-transform:uppercase;letter-spacing:.05em;cursor:pointer;}
  .tprazd{padding:12px 6px;color:#7B99B8;font-size:13px;}

  /* --- odporucanie a nahrady --- */
  .fld.next .k .az{background:#2E7D52;color:#fff;font-size:9.5px;padding:1px 5px;border-radius:2px;margin-left:5px;letter-spacing:.06em;}
  .fld.next .k .rz{background:#B26A00;color:#fff;font-size:9.5px;padding:1px 5px;border-radius:2px;margin-left:5px;letter-spacing:.06em;}
  .prw{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
  .prw input{flex:1;min-width:130px;border:1px solid #BFD4C6;border-radius:3px;padding:8px 9px;
    font-family:'Barlow',sans-serif;font-size:13.5px;background:#fff;color:#12293E;}
  .prw button{background:#2E7D52;color:#fff;border:0;border-radius:3px;padding:8px 12px;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13.5px;
    text-transform:uppercase;letter-spacing:.04em;cursor:pointer;}
  .prw button.alt{background:none;color:#2E7D52;border:1px solid #9CC5AE;}
  .fld.swap{background:#F2F6FA;padding:9px 11px;border-radius:2px;}
  .fld.swap .k{color:#4A6B87;}
  .sw{margin-bottom:6px;font-size:13.5px;line-height:1.45;}
  .sw:last-child{margin-bottom:0;}

  /* --- log riadok 2 a casovac --- */
  .log-row2{display:flex;gap:6px;margin-top:7px;}
  .log-row2 input{flex:1;min-width:0;border:1px solid #CBD8E3;border-radius:3px;padding:9px 10px;
    font-family:'Barlow',sans-serif;font-size:13.5px;background:#fff;color:#12293E;}
  .tbtn{flex:0 0 auto;background:#fff;border:1px solid #12293E;color:#12293E;border-radius:3px;
    padding:9px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;
    letter-spacing:.03em;cursor:pointer;white-space:nowrap;}
  .pzn{display:block;font-style:normal;font-size:12px;color:#7B99B8;margin-top:1px;}
  .casbar{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#12293E;color:#fff;
    display:flex;align-items:center;gap:11px;padding:13px 16px;
    box-shadow:0 -3px 14px rgba(0,0,0,.22);}
  .casbar.hotovo{background:#2E7D52;}
  .casbar .ct{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;
    letter-spacing:.02em;min-width:62px;}
  .casbar .cl{flex:1;font-family:'Barlow',sans-serif;font-size:12.5px;color:#B9CDDF;}
  .casbar button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:3px;
    padding:8px 13px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;
    text-transform:uppercase;letter-spacing:.05em;cursor:pointer;}
  .fld.next{background:#EAF4EE;padding:9px 11px;border-radius:2px;}
  .fld.next .k{color:#2E7D52;}
  .fld.next .v{color:#1F5C3B;font-weight:600;}
  .fld.mist{background:#FBF3EF;padding:9px 11px;border-radius:2px;}
  .fld.mist .k{color:#A5695A;}
  .fld.mist .v{color:#6B4A3E;}

  .log{margin-top:13px;padding-top:12px;border-top:2px solid #E3EAF0;}
  .log-row{display:flex;gap:7px;}
  .log input{flex:1;min-width:0;background:#F4F8FA;border:1.5px solid #D5E0E8;
    font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--deep);
    padding:10px 11px;border-radius:2px;}
  .log input:focus{outline:2px solid var(--line);outline-offset:1px;}
  .log button{background:var(--deep);color:#fff;border:0;cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
    text-transform:uppercase;letter-spacing:.05em;padding:0 16px;height:42px;border-radius:2px;}
  .last{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--steel);
    margin-top:8px;line-height:1.65;}
  .last b{color:var(--line);}
  .last .old{color:#B4C4D2;}

  .foot{margin:24px 18px 0;background:var(--deep);color:#fff;padding:17px;border-radius:3px;}
  .foot h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;
    text-transform:uppercase;letter-spacing:.06em;margin:0 0 9px;}
  .foot p{margin:0 0 10px;font-size:13.5px;line-height:1.55;color:#C3D4E2;}
  .foot p:last-child{margin:0;}
  .foot b{color:#fff;}
  .foot .red{color:#FF8A75;}
  .foot table{width:100%;border-collapse:collapse;font-size:13px;}
  .foot td{padding:6px 0;border-top:1px solid #1C3450;color:#C3D4E2;}
  .foot td:last-child{text-align:right;font-family:'JetBrains Mono',monospace;color:#fff;font-weight:700;}

  .pr{background:var(--card);border-radius:3px;border-left:5px solid var(--line);
    padding:12px 13px;margin-bottom:7px;}
  .pr.pr-empty{border-left-color:#D5E0E8;}
  .pr .pn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;line-height:1.15;}
  .pr .pe{font-size:12.5px;color:#B4C4D2;margin-top:3px;}
  .pr .ph{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:12px;}
  .pr .ph div{display:flex;justify-content:space-between;gap:12px;
    padding:5px 0;border-top:1px solid #EDF2F6;color:var(--steel);}
  .pr .ph div:first-child{border-top:0;}
  .pr .ph div b{color:var(--deep);text-align:right;}
  .pr .ph div.old b{color:#8FA3B4;font-weight:400;}
  .pr .gr{margin-top:10px;background:#F6F9FB;border-radius:3px;padding:8px 9px 6px;}
  .pr .gr svg{width:100%;height:64px;display:block;}
  .pr .grl{display:flex;justify-content:space-between;align-items:baseline;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--steel);margin-top:5px;}
  .pr .grl .up{color:#2E8B57;font-weight:700;}
  .pr .grl .flat{color:var(--steel);}
  .pr .grl .dn{color:var(--center);font-weight:700;}
  .io{margin:22px 18px 0;background:var(--card);border-left:5px solid var(--deep);
    border-radius:3px;padding:14px;}
  .io h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;
    text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;}
  .io p{margin:0 0 12px;font-size:13px;line-height:1.5;color:var(--steel);}
  .io-row{display:flex;gap:8px;}
  .io-btn{flex:1;background:var(--deep);color:#fff;border:0;cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
    text-transform:uppercase;letter-spacing:.05em;padding:13px 8px;border-radius:2px;}
  .io-btn.alt{background:#fff;color:var(--deep);border:2px solid var(--deep);}
  .io-btn:active{opacity:.85;}
  .io-msg{margin-top:11px;font-size:13px;line-height:1.5;padding:10px 12px;border-radius:2px;}
  .io-msg.ok{background:#EAF4EE;color:#1F5C3B;border-left:4px solid #2E8B57;}
  .io-msg.bad{background:#FBE9E7;color:#8A2E22;border-left:4px solid var(--center);}
  .pdel{margin-top:9px;background:none;border:0;padding:0;cursor:pointer;
    font-family:'Barlow',sans-serif;font-size:12px;color:var(--center);
    text-decoration:underline;text-underline-offset:2px;}

  .err{margin:12px 18px;padding:11px 13px;background:#FBE9E7;
    border-left:4px solid var(--center);font-size:13px;}
  .loading{padding:40px 18px;text-align:center;color:var(--steel);font-size:14px;}
  @media(max-width:560px){
    body{padding-bottom:72px;}
    .wrap{width:100%;max-width:none;}
    .board{padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0;}
    .board-top{align-items:flex-start;flex-direction:column;gap:6px;}
    .cloudbar{width:100%;justify-content:flex-start;font-size:10px;}
    .cloudbar .cloudmail{max-width:calc(100vw - 130px);}
    .tabs{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 3px;
      width:100%;margin-top:10px;overflow:visible;}
    .tab{min-width:0;width:100%;padding:9px 3px 8px;font-size:14px;line-height:1;
      border-bottom-width:3px;}
    .tab:nth-child(-n+4){grid-column:span 3;}
    .tab:nth-child(n+5){grid-column:span 4;}
    .tab span{font-size:8.5px;line-height:1.15;margin-top:3px;}
    .head{padding:17px 14px 0;}
    .head h1{font-size:28px;}
    .head .sub{font-size:13px;}
    .blk{margin-left:14px;margin-right:14px;}
    .warm,.foot,.io{margin-left:14px;margin-right:14px;}
    .dr{gap:9px;}
    .dd{width:76px;flex-basis:76px;}
    .dt b{font-size:14.5px;}
    .dt i{font-size:12px;}
    .facts{gap:14px;flex-wrap:wrap;}
    .log-row{flex-wrap:wrap;}
    .log-row input{flex:1 1 170px;}
    .log-row .tbtn{flex:1 1 100%;height:38px;}
    .telform{flex-wrap:wrap;}
    .telform input{flex:1 1 calc(50% - 4px);}
    .telform button{flex:1 1 100%;}
    .io-row{flex-direction:column;}
    .zr{align-items:flex-start;}
    .zv{max-width:52%;white-space:normal;}
    .pikrow{display:block;padding-top:2px;}
  }
  @media(max-width:360px){
    .board{padding-left:10px;padding-right:10px;}
    .tab{font-size:13px;padding-left:2px;padding-right:2px;}
    .tab span{font-size:8px;}
    .head,.blk,.warm,.foot,.io{margin-left:0;margin-right:0;}
    .head{padding-left:12px;padding-right:12px;}
    .blk{margin-left:12px;margin-right:12px;}
    .warm,.foot,.io{margin-left:12px;margin-right:12px;}
    .dd{width:70px;flex-basis:70px;}
  }

  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

/* Funguje aj v Claude, aj ako samostatná stranka na GitHub Pages. */
const ULOZISKO={
  async get(kluc){
    const k=kluc||KEY;
    if(window.storage&&window.storage.get){
      try{const r=await window.storage.get(k); return r&&r.value?r.value:null;}catch(e){}
    }
    try{return window.localStorage.getItem(k);}catch(e){return null;}
  },
  async set(v,kluc){
    const k=kluc||KEY;
    if(window.storage&&window.storage.set){
      try{await window.storage.set(k,v); return true;}catch(e){}
    }
    try{window.localStorage.setItem(k,v); return true;}catch(e){return false;}
  }
};

async function doplnSeed(){

  const davky=[[SEED_KLUC,SEED,'18.8.'],[SEED_C_KLUC,SEED_C,'22.8.']];
  for(const [kluc,data,datum] of davky){
    const hotovo=await ULOZISKO.get(kluc);
    if(hotovo) continue;
    Object.keys(data).forEach(id=>{
      if(!log[id]) log[id]=[];
      const duplikat=log[id].some(x=>x.d===datum && x.v===data[id]);
      if(!duplikat){ log[id].unshift({d:datum, v:data[id]});  pridane++; }
    });

  }
  if(pridane) await uloz();
  return pridane>0;
}

function prettyIso(iso){
  const m=String(iso||'').match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? (+m[3])+'.'+(+m[2])+'.'+m[1] : iso;
}
function todayIso(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function metaAny(id){
  const m=metaCviku(id);
  if(m.typ!=='neznámy') return m;
  return LEGACY_META[id] || {typ:'Archív',den:'',cvik:id,skupina:''};
}
async function cloudFetchAll(table, orderCol){
  let out=[], from=0, step=1000;
  while(true){
    let q=db.from(table).select('*').range(from,from+step-1);
    if(orderCol) q=q.order(orderCol,{ascending:false});
    const {data,error}=await q;
    if(error) throw error;
    out=out.concat(data||[]);
    if(!data || data.length<step) break;
    from+=step;
  }
  return out;
}
async function cloudLoad(){
  const rows=await cloudFetchAll('workout_logs','performed_on');
  log={};
  rows
    .sort((a,b)=>(String(b.performed_on)+String(b.created_at)).localeCompare(String(a.performed_on)+String(a.created_at)))
    .forEach(r=>{
      if(!log[r.exercise_id]) log[r.exercise_id]=[];
      log[r.exercise_id].push({
        d:prettyIso(r.performed_on),
        v:r.raw_entry,
        p:r.note||'',
        _cloud_id:r.id,
        _iso:r.performed_on
      });
    });

  const tm=await cloudFetchAll('body_measurements','measured_on');
  telo=tm.map(r=>({
    d:prettyIso(r.measured_on),
    w:Number(r.weight_kg),
    p:Number(r.waist_cm),
    _cloud_id:r.id,
    _iso:r.measured_on
  }));

  const {data:setRows,error:setErr}=await db.from('user_settings').select('*');
  if(setErr) throw setErr;
  const manual=(setRows||[]).find(x=>x.setting_key==='manual_overrides');
  prepis=manual && manual.setting_value ? manual.setting_value : {};

  await ULOZISKO.set(JSON.stringify(log));
  await ULOZISKO.set(JSON.stringify(telo),TELO_KLUC);
  await ULOZISKO.set(JSON.stringify(prepis),PREPIS_KLUC);
}
async function cloudUploadLocal(){
  const existing=await cloudFetchAll('workout_logs','performed_on');
  const seen=new Set(existing.map(r=>r.exercise_id+'|'+r.performed_on+'|'+r.raw_entry));
  const payload=[];
  Object.keys(log).forEach(id=>{
    const meta=metaAny(id);
    (log[id]||[]).forEach(x=>{
      let iso=x._iso || isoDatum(x.d);
      if(!iso) return;
      const k=id+'|'+iso+'|'+x.v;
      if(seen.has(k)) return;
      const p=parseZapis(x.v);
      payload.push({
        user_id:cloudUser.id,
        exercise_id:id,
        exercise_name:meta.cvik,
        performed_on:iso,
        weight_kg:p.w,
        reps:p.reps||[],
        raw_entry:x.v,
        note:x.p||''
      });
      seen.add(k);
    });
  });
  if(payload.length){
    for(let i=0;i<payload.length;i+=500){
      const {error}=await db.from('workout_logs').insert(payload.slice(i,i+500));
      if(error) throw error;
    }
  }

  const bodyPayload=[];
  (telo||[]).forEach(x=>{
    let iso=x._iso || isoDatum(x.d);
    // User corrected the baseline: 92 kg / 98 cm was measured on 30 Aug 2026.
    if(iso==='2026-08-31' && Number(x.w)===92 && Number(x.p)===98) iso='2026-08-30';
    if(!iso) return;
    bodyPayload.push({
      user_id:cloudUser.id,
      measured_on:iso,
      weight_kg:Number(x.w),
      waist_cm:Number(x.p)
    });
  });
  // Ensure the corrected baseline exists even if the old local file cannot be read.
  if(!bodyPayload.some(x=>x.measured_on==='2026-08-30')){
    bodyPayload.push({user_id:cloudUser.id,measured_on:'2026-08-30',weight_kg:92,waist_cm:98});
  }
  if(bodyPayload.length){
    const {error}=await db.from('body_measurements')
      .upsert(bodyPayload,{onConflict:'user_id,measured_on'});
    if(error) throw error;
  }

  const {error:setErr}=await db.from('user_settings').upsert({
    user_id:cloudUser.id,
    setting_key:'manual_overrides',
    setting_value:prepis||{}
  },{onConflict:'user_id,setting_key'});
  if(setErr) throw setErr;
}
async function prepareCloud(){
  const {data:mark,error}=await db.from('user_settings')
    .select('setting_value')
    .eq('setting_key','local_migration_v1')
    .maybeSingle();
  if(error) throw error;
  if(!mark){
    await cloudUploadLocal();
    const {error:e2}=await db.from('user_settings').upsert({
      user_id:cloudUser.id,
      setting_key:'local_migration_v1',
      setting_value:{done:true,at:new Date().toISOString()}
    },{onConflict:'user_id,setting_key'});
    if(e2) throw e2;
  }
  await cloudLoad();

  // Safety: make sure the corrected 30 Aug baseline exists in cloud.
  if(!telo.some(x=>x._iso==='2026-08-30')){
    const {error}=await db.from('body_measurements').upsert({
      user_id:cloudUser.id, measured_on:'2026-08-30', weight_kg:92, waist_cm:98
    },{onConflict:'user_id,measured_on'});
    if(error) throw error;
    await cloudLoad();
  }
}

function parseZapis(t){
  const s=String(t).split('(')[0];
  let m=s.match(/(\d+(?:[.,]\d+)?)\s*kg/i);
  let idx, w;
  if(m){ w=parseFloat(m[1].replace(',','.')); idx=m.index+m[0].length; }
  else{
    m=s.match(/(\d+(?:[.,]\d+)?)/);
    if(!m) return {w:null,reps:[],objem:null};
    w=parseFloat(m[1].replace(',','.')); idx=m.index+m[0].length;
  }
  const reps=(s.slice(idx).match(/\d+/g)||[]).map(Number).filter(x=>x>0&&x<100);
  const objem=reps.length?Math.round(w*reps.reduce((a,b)=>a+b,0)):null;
  return {w,reps,objem};
}

function grafHtml(zaznamy){
  const b=[...zaznamy].reverse().map(x=>({d:x.d,...parseZapis(x.v)})).filter(x=>x.w!==null);
  if(b.length<2) return '';
  const W=520,H=64,P=9;
  const vals=b.map(x=>x.w);
  const mn=Math.min(...vals), mx=Math.max(...vals), rng=(mx-mn)||1;
  const pts=b.map((x,i)=>[
    P+(i/(b.length-1))*(W-P*2),
    P+(1-(x.w-mn)/rng)*(H-P*2)
  ]);
  const linia=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const plocha=linia+' L '+pts[pts.length-1][0].toFixed(1)+' '+H+' L '+pts[0][0].toFixed(1)+' '+H+' Z';
  const kruhy=pts.map((q,i)=>
    `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i===pts.length-1?4:3}"
      fill="${i===pts.length-1?'#C8102E':'#1F5FBF'}"/>`).join('');
  const d=+(b[b.length-1].w-b[0].w).toFixed(1);
  const trend = d>0 ? `<span class="up">+${d} kg</span>`
             : d<0 ? `<span class="dn">${d} kg</span>`
                   : `<span class="flat">bez zmeny</span>`;
  const o1=b[0].objem, o2=b[b.length-1].objem;
  const obj = (o1&&o2) ? ` · objem ${o1} → ${o2} kg` : '';
  return `<div class="gr">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Vývoj váhy">
      <path d="${plocha}" fill="#1F5FBF" opacity="0.10"/>
      <path d="${linia}" fill="none" stroke="#1F5FBF" stroke-width="2.5" stroke-linejoin="round"/>
      ${kruhy}
    </svg>
    <div class="grl"><span>${b[0].d} · ${b[0].w} kg → ${b[b.length-1].w} kg${obj}</span>${trend}</div>
  </div>`;
}

/* ---------- AUTOMATICKÉ ODPORÚČANIE VÁHY ---------- */

function poslednyZapis(id){
  const z=log[id]||[];
  return z.length?z[0]:null;
}

function odporucanie(c){
  if(c.nolog) return null;
  if(prepis[c.id]) return {text:prepis[c.id], rucne:true};
  const p=poslednyZapis(c.id);
  if(!p) return {text:'Prvý tréning — začni tak, aby posledné opakovanie bolo ťažké, ale čisté.', rucne:false};
  const d=parseZapis(p.v);
  if(d.w===null || !d.reps || !d.reps.length)
    return {text:'Zápis sa nedá prečítať. Použi tvar <b>váha · opakovania</b>, napríklad 55 kg · 6,6,6,6.', rucne:false};

  const w=d.w, reps=d.reps;
  const min=Math.min(...reps), pocet=reps.length;
  const vsetkyNaMax = reps.every(r=>r>=c.mx);
  const vsetkyNaMin = reps.every(r=>r>=c.mn);
  const dost = pocet>=c.ser;
  const kg = x=>(Math.round(x*10)/10).toString().replace('.',',');

  if(vsetkyNaMax && dost){
    if(c.prio==='o' && c.mx<c.mn+6){
      return {text:`Zvýš cieľ na <b>${c.mx+3} opakovaní</b> pri ${kg(w)} kg. Kilá sem pridávaj až potom.`, rucne:false};
    }
    return {text:`Choď na <b>${kg(w+c.krok)} kg</b>, cieľ ${c.ser} × ${c.mn}.`, rucne:false};
  }
  if(vsetkyNaMin && dost){
    return {text:`Drž <b>${kg(w)} kg</b>, cieľ ${c.ser} × ${c.mx} vo všetkých sériách. Až potom pridaj ${kg(c.krok)} kg.`, rucne:false};
  }
  if(!dost){
    return {text:`Drž <b>${kg(w)} kg</b> a dokonči ${c.ser} série. Naposledy si urobil ${pocet}.`, rucne:false};
  }
  const chyba = c.mn-min;
  if(chyba>=3){
    return {text:`Posledné série spadli na ${min}. Zníž na <b>${kg(Math.max(c.krok,w-c.krok))} kg</b> a rob ${c.ser} × ${c.mn} čisto.`, rucne:false};
  }
  return {text:`Drž <b>${kg(w)} kg</b>, cieľ ${c.ser} × ${c.mn} vo všetkých sériách. Predĺž pauzu, ak posledné série padajú.`, rucne:false};
}

let casovac={id:null, zostava:0, tik:null};

function spustCasovac(id, sek){
  zastavCasovac();
  casovac.id=id; casovac.zostava=sek;
  vykresliCasovac();
  casovac.tik=setInterval(()=>{
    casovac.zostava--;
    if(casovac.zostava<=0){
      vykresliCasovac(true);
      clearInterval(casovac.tik); casovac.tik=null;
      try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
      setTimeout(()=>{ zastavCasovac(); }, 4000);
    } else vykresliCasovac();
  },1000);
}

function zastavCasovac(){
  if(casovac.tik) clearInterval(casovac.tik);
  casovac={id:null, zostava:0, tik:null};
  const b=document.getElementById('cas-bar');
  if(b) b.remove();
}

function vykresliCasovac(hotovo){
  let b=document.getElementById('cas-bar');
  if(!b){
    b=document.createElement('div');
    b.id='cas-bar'; b.className='casbar';
    document.body.appendChild(b);
  }
  const m=Math.floor(casovac.zostava/60), sek=casovac.zostava%60;
  b.className='casbar'+(hotovo?' hotovo':'');
  b.innerHTML = hotovo
    ? `<span class="ct">Pauza hotová — ideš</span><button onclick="zastavCasovac()">Zavrieť</button>`
    : `<span class="ct">${m}:${String(Math.max(sek,0)).padStart(2,'0')}</span>
       <span class="cl">pauza medzi sériami</span>
       <button onclick="zastavCasovac()">Stop</button>`;
}

function metaCviku(id){
  for(const [kluc,T] of [['A',A],['B',B],['C',C]]){
    for(const b of T.bloky){
      for(const c of b.cviky){
        if(c.id===id) return {typ:'Tréning '+kluc, den:kluc==='A'?'utorok':(kluc==='C'?'sobota':'štvrtok'), cvik:c.n, skupina:b.n};
      }
    }
  }
  return {typ:'neznámy', den:'', cvik:id, skupina:''};
}

function isoDatum(d){
  // d je v tvare "14.8." -> doplní rok podľa dnešného dátumu
  const m=String(d).match(/(\d+)\.\s*(\d+)\./);
  if(!m) return null;
  const den=+m[1], mes=+m[2];
  const dnes=new Date();
  let rok=dnes.getFullYear();
  // ak by dátum vyšiel do budúcnosti o viac ako mesiac, ide o minulý rok
  const kandidat=new Date(rok,mes-1,den);
  if(kandidat-dnes>31*24*3600*1000) rok--;
  return rok+'-'+String(mes).padStart(2,'0')+'-'+String(den).padStart(2,'0');
}

        cvikId: id,

        vaha: p.w,
        jednotka: 'kg',
        opakovania: p.reps,
        serie: p.reps.length,
        objem: p.objem,

        surovyZapis: x.v
      });
    });
  });
  zaznamy.sort((a,b)=>String(b.datum||'').localeCompare(String(a.datum||'')));
  return {
    verzia: 1,
    aplikacia: 'Tréningy A/B/C',
    exportovane: new Date().toISOString(),
    pocetZaznamov: zaznamy.length,
    zaznamy: zaznamy,
    telo: telo
  };
}

function exportuj(){
  try{
    const data=zostavJson();
    if(!data.pocetZaznamov){ ioSprava('Nemáš zatiaľ žiadne zápisy na export.','bad'); return; }
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='treningy.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},300);
    ioSprava('Hotovo. Uložených '+data.pocetZaznamov+' záznamov do treningy.json.','ok');
  }catch(e){
    ioSprava('Export zlyhal: '+e.message,'bad');
  }
}

function spustImport(){
  const inp=document.getElementById('importFile');
  if(inp) inp.click();
}

async function nacitajSubor(ev){
  const f=ev.target.files && ev.target.files[0];
  if(!f) return;
  try{
    const txt=await f.text();
    const data=JSON.parse(txt);
    const zaznamy=Array.isArray(data)?data:(data.zaznamy||[]);
    if(!zaznamy.length){ ioSprava('V súbore nie sú žiadne záznamy.','bad'); return; }

    let pridane=0, preskocene=0, neznameCviky=0;
    zaznamy.forEach(z=>{
      const id=z.cvikId;
      if(!id){ neznameCviky++; return; }
      const d=z.datumZobrazenie || (z.datum ? (()=>{const[,m,dd]=z.datum.split('-');return (+dd)+'.'+(+m)+'.';})() : null);
      const v=z.surovyZapis || (z.vaha!=null ? z.vaha+' kg · '+(z.opakovania||[]).join(',') : null);
      if(!d || !v){ preskocene++; return; }
      if(!log[id]) log[id]=[];
      const duplikat=log[id].some(x=>x.d===d && x.v===v);
      if(duplikat){ preskocene++; return; }
      const zaz={d:d, v:v};
      if(z.poznamka) zaz.p=z.poznamka;
      log[id].push(zaz);
      pridane++;
    });

    // zoradiť podľa dátumu zostupne a orezať na 6
    Object.keys(log).forEach(id=>{
      log[id].sort((a,b)=>String(isoDatum(b.d)||'').localeCompare(String(isoDatum(a.d)||'')));
      
    });

    let teloPridane=0;
    if(Array.isArray(data.telo)){
      data.telo.forEach(t=>{
        if(t&&t.d&&t.w!=null&&t.p!=null&&!telo.some(x=>x.d===t.d)){ telo.push(t); teloPridane++; }
      });
      if(teloPridane){
        telo.sort((a,b)=>String(isoDatum(b.d)||'').localeCompare(String(isoDatum(a.d)||'')));
        
        await ULOZISKO.set(JSON.stringify(telo), TELO_KLUC);
      }
    }

    await uloz();
    if(cloudUser){
      try{await cloudUploadLocal();await cloudLoad();}catch(e){ioSprava('Import lokálne prebehol, ale cloud sync zlyhal: '+e.message,'bad');return;}
    }
    let msg='Doplnených '+pridane+' záznamov.';
    if(teloPridane) msg+=' Plus '+teloPridane+' meraní tela.';
    if(preskocene) msg+=' Preskočených '+preskocene+' (duplikáty alebo neúplné).';
    if(neznameCviky) msg+=' '+neznameCviky+' bez rozpoznaného cviku.';
    render();
    setTimeout(()=>ioSprava(msg,'ok'),50);
  }catch(e){
    ioSprava('Súbor sa nepodarilo načítať. Skontroluj, či ide o treningy.json.','bad');
  }finally{
    ev.target.value='';
  }
}

function ioSprava(text,typ){
  const el=document.getElementById('ioMsg');
  if(!el) return;
  el.className='io-msg '+(typ||'ok');
  el.textContent=text;
}

function renderProgres(){

    const an=metaAny(a).cvik.toLowerCase(), bn=metaAny(b).cvik.toLowerCase();
    return an.localeCompare(bn,'sk');
  });
  const currentIds=new Set([...vsetkyCviky(A),...vsetkyCviky(B),...vsetkyCviky(C)].map(c=>c.id));
  const cards=ids.map(id=>{
    const z=log[id]||[];
    const meta=metaAny(id);

    return `<div class="pr">
      <div class="pn">${meta.cvik}</div>

      ${z.length?`<div class="ph">${z.slice(0,3).map((x,i)=>`<div class="${i>0?'old':''}"><span>${x.d}</span><b>${x.v}</b></div>`).join('')}</div>`:''}
      ${grafHtml(z)}
      ${z.length?`<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600;color:#1F5FBF">Všetky zápisy</summary>
        <div class="zoz">${z.map(x=>`<div class="zr"><span class="zn">${x.d}${x.p?`<em class="pzn">${x.p}</em>`:''}</span><span class="zv">${x.v}</span></div>`).join('')}</div>
      </details>`:''}
    </div>`;
  }).join('');

  const bezHist=[...vsetkyCviky(A),...vsetkyCviky(B),...vsetkyCviky(C)]
    .filter(c=>!(log[c.id]||[]).length)
    .map(c=>`<div class="zr zr-empty"><span class="zn">${c.n}</span><span class="zv">bez zápisu</span></div>`).join('');

  const spolu=Object.keys(log).reduce((a,k)=>a+(log[k]||[]).length,0);
  document.getElementById('app').innerHTML=boardHtml()+`
    <div class="head">
      <h1>Progres</h1>
      <div class="sub"><b>Kompletná história všetkých cvikov</b>, aj tých, ktoré už nie sú v aktuálnom pláne.</div>
      <div class="facts"><div><div class="k">Zápisov spolu</div><div class="v">${spolu}</div></div><div><div class="k">Cvikov v histórii</div><div class="v">${ids.length}</div></div></div>
    </div>
    <div class="blk"><div class="blk-lbl"><h2>História cvikov</h2></div>${cards||'<div class="tprazd">Zatiaľ bez tréningových zápisov.</div>'}</div>
    ${bezHist?`<div class="blk"><div class="blk-lbl"><h2>Aktuálne bez histórie</h2></div><div class="zoz">${bezHist}</div></div>`:''}
    <div class="io">
      <h3>Záloha</h3>
      <p>Cloud je primárne úložisko. Export JSON ostáva ako ďalšia offline poistka.</p>
      <div class="io-row"><button class="io-btn" onclick="exportuj()">Export JSON</button><button class="io-btn alt" onclick="spustImport()">Import JSON</button></div>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="nacitajSubor(event)">
      <div id="ioMsg"></div>
    </div>`;
}

function renderDnes(){
  const dnesDen=new Date().getDay();
  const riadky=TYZDEN.map(x=>{
    const je=x.d===dnesDen;
    const klik=x.tab?`onclick="prepniTab('${x.tab}')"`:'';
    return `<div class="dr ${je?'dnes':''} ${x.tab?'klik':''}" ${klik}>
      <div class="dd">${x.n}${je?'<span>dnes</span>':''}</div>
      <div class="dt"><b>${x.t}</b><i>${x.s}</i></div>
      ${x.tab?CHEV:''}
    </div>`;
  }).join('');

  const t=telo.length?telo[0]:null;
  const tPred=telo.length>1?telo[1]:null;
  const rozdiel=(a,b,j)=>{
    if(a==null||b==null) return '';
    const d=Math.round((a-b)*10)/10;
    if(d===0) return `<em class="flat">bez zmeny</em>`;
    return d<0?`<em class="dn">${d} ${j}</em>`:`<em class="up">+${d} ${j}</em>`;
  };
  const teloHtml = t ? `
    <div class="tel">
      <div><span class="k">Váha</span><span class="v">${t.w} kg ${rozdiel(t.w,tPred&&tPred.w,'kg')}</span></div>
      <div><span class="k">Pás</span><span class="v">${t.p} cm ${rozdiel(t.p,tPred&&tPred.p,'cm')}</span></div>
      <div><span class="k">Pás/výška</span><span class="v">${(t.p/183).toFixed(3)}</span></div>
    </div>` : `<div class="tel prazdne">Zatiaľ bez merania. Zapíš ho v záložke Telo.</div>`;

  document.getElementById('app').innerHTML=boardHtml()+`
    <div class="head">
      <h1>Týždenný plán</h1>
      <div class="sub">Šesť tréningových dní, nedeľa voľno. <b>Ak ranné čísla vyzerajú zle, deň sa dá presunúť — plán nie je príkaz.</b></div>
    </div>
    <div class="blk"><div class="blk-lbl"><h2>Týždeň</h2></div>${riadky}</div>
    <div class="blk"><div class="blk-lbl"><h2>Posledné meranie</h2><span class="t">${t?t.d:'—'}</span></div>${teloHtml}</div>
    <div class="foot">
      <h3>Ciele</h3>
      <table>
        <tr><td>Váha</td><td>90 kg pri 13–14 % tuku</td></tr>
        <tr><td>Pás</td><td>medzicieľ 94 cm · cieľ 86–88 cm</td></tr>
        <tr><td>Bielkoviny</td><td>160 g denne, minimum 150 g</td></tr>
        <tr><td>Okno</td><td>10:00–20:00 · piatok výnimka po hokeji</td></tr>
      </table>
    </div>`;
}

function renderTelo(){
  const b=[...telo].reverse();
  const graf=(kluc,farba,jed)=>{
    const body=b.filter(x=>x[kluc]!=null);
    if(body.length<2) return '<div class="tprazd">Aspoň dve merania a objaví sa graf.</div>';
    const W=520,H=70,P=10;
    const vals=body.map(x=>x[kluc]);
    const mn=Math.min(...vals), mx=Math.max(...vals), rng=(mx-mn)||1;
    const pts=body.map((x,i)=>[P+(i/(body.length-1))*(W-P*2), P+(1-(x[kluc]-mn)/rng)*(H-P*2)]);
    const linia=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
    const kruhy=pts.map((q,i)=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i===pts.length-1?4:3}" fill="${i===pts.length-1?'#C8102E':farba}"/>`).join('');
    const d=Math.round((vals[vals.length-1]-vals[0])*10)/10;
    const tr=d<0?`<span class="dn">${d} ${jed}</span>`:d>0?`<span class="up">+${d} ${jed}</span>`:`<span class="flat">bez zmeny</span>`;
    return `<div class="gr">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${linia}" fill="none" stroke="${farba}" stroke-width="2.5" stroke-linejoin="round"/>${kruhy}</svg>
      <div class="grl"><span>${body[0].d} · ${vals[0]} → ${vals[vals.length-1]} ${jed}</span>${tr}</div>
    </div>`;
  };

  const zoznam=telo.length?telo.map((x,i)=>
    `<div class="zr"><span class="zn">${x.d}</span><span class="zv">${x.w} kg · ${x.p} cm${i===0?'<button class="pdel" onclick="zmazTelo()">Zmazať</button>':''}</span></div>`
  ).join(''):'<div class="zr zr-empty"><span class="zn">Zatiaľ bez merania</span><span class="zv">&mdash;</span></div>';

  document.getElementById('app').innerHTML=boardHtml()+`
    <div class="head">
      <h1>Váha a pás</h1>
      <div class="sub">Meraj <b>raz týždenne v nedeľu ráno</b>, po WC, pred pitím, nahý. Pás cez pupok vodorovne, na konci normálneho výdychu.
      <b>Pri rekompozícii hovorí pás viac než váha.</b></div>
    </div>
    <div class="blk"><div class="blk-lbl"><h2>Nové meranie</h2></div>
      <div class="telform">
        <input id="t-w" type="number" step="0.1" inputmode="decimal" placeholder="Váha kg">
        <input id="t-p" type="number" step="0.5" inputmode="decimal" placeholder="Pás cm">
        <button onclick="zapisTelo()">Zapíš</button>
      </div>
    </div>
    <div class="blk"><div class="blk-lbl"><h2>Váha</h2></div>${graf('w','#1F5FBF','kg')}</div>
    <div class="blk"><div class="blk-lbl"><h2>Pás</h2></div>${graf('p','#2E7D52','cm')}</div>
    <div class="blk"><div class="blk-lbl"><h2>Všetky merania</h2></div><div class="zoz">${zoznam}</div></div>
    <div class="foot">
      <h3>Ako to čítať</h3>
      <p>Denné výkyvy váhy 1 až 2 kg sú voda, glykogén a obsah čriev, nie tuk. <b>Jedno číslo nie je trend</b>, zmysel to dáva po štyroch týždňoch.</p>
      <p>Ak váha stojí a pás klesá, je to <b>presne ten výsledok, ktorý chceš</b> — svaly pribúdajú, tuk ubúda.</p>
      <p>Cieľový pomer pás/výška je <b>0,47</b>, čo je pri 183 cm zhruba 86 cm.</p>
    </div>`;
}

async function zapisTelo(){
  const w=parseFloat((document.getElementById('t-w').value||'').replace(',','.'));
  const pas=parseFloat((document.getElementById('t-p').value||'').replace(',','.'));
  if(!w||!pas){chyba('Vyplň váhu aj pás.');return;}
  const {error}=await db.from('body_measurements').upsert({
    user_id:cloudUser.id,
    measured_on:todayIso(),
    weight_kg:Math.round(w*10)/10,
    waist_cm:Math.round(pas*10)/10
  },{onConflict:'user_id,measured_on'});
  if(error){chyba('Cloud zápis merania zlyhal: '+error.message);return;}
  await cloudLoad();
  render();
}

async function zmazTelo(){
  if(!telo.length) return;
  if(!confirm('Zmazať meranie z '+telo[0].d+'?')) return;
  if(telo[0]._cloud_id){
    const {error}=await db.from('body_measurements').delete().eq('id',telo[0]._cloud_id);
    if(error){chyba('Mazanie merania zlyhalo: '+error.message);return;}
    await cloudLoad();
  }else{
    telo.shift();
    await ULOZISKO.set(JSON.stringify(telo),TELO_KLUC);
  }
  render();
}
