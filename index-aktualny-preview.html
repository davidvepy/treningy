<!doctype html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tréningy</title>
<meta name="description" content="Osobný tréningový denník s logom výkonu a progresu.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tréningy">
<meta name="theme-color" content="#10233A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ice:#EEF3F6;
    --deep:#10233A;
    --deep-2:#18314D;
    --line:#1F5FBF;
    --red:#C8102E;
    --green:#2E7D52;
    --gold:#A86500;
    --steel:#6F879D;
    --muted:#B8C8D5;
    --card:#FFFFFF;
    --soft:#F4F8FA;
    --border:#DCE5EC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;background:var(--ice);}
  body{font-family:'Barlow',system-ui,sans-serif;color:var(--deep);padding-bottom:32px;}
  button,input{font:inherit;}
  button{cursor:pointer;}
  button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #6EA8E8;outline-offset:2px;}
  .app{max-width:780px;margin:0 auto;}
  .topbar{background:var(--deep);color:#fff;padding:16px 18px 0;position:sticky;top:0;z-index:20;box-shadow:0 3px 14px rgba(16,35,58,.16);}
  .toprow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;color:#91A8BD;}
  .brand{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;line-height:.9;text-transform:uppercase;letter-spacing:.02em;margin-top:5px;}
  .sync-badge{font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1;color:#B9CDDF;border:1px solid #35516D;border-radius:99px;padding:7px 8px;white-space:nowrap;}
  .sync-badge.cloud{color:#BFE6CC;border-color:#397355;}
  .sync-badge.warn{color:#FFD19B;border-color:#8B5D27;}
  .main-nav{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;margin:16px -4px 0;}
  .main-nav::-webkit-scrollbar{display:none;}
  .nav-btn{flex:0 0 auto;background:transparent;color:#6E8AA5;border:0;border-bottom:4px solid transparent;padding:10px 10px 11px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .nav-btn.active{color:#fff;border-bottom-color:var(--red);}
  .page{padding:0 18px 34px;}
  .page-head{padding:21px 0 0;}
  .page-head h1{font-family:'Barlow Condensed',sans-serif;font-size:34px;line-height:.98;font-weight:800;text-transform:uppercase;margin:0;letter-spacing:.01em;}
  .page-head h1 span{color:var(--red);}
  .page-head p{color:var(--steel);font-size:15px;line-height:1.5;margin:9px 0 0;max-width:680px;}
  .date-line{font-family:'JetBrains Mono',monospace;color:var(--line);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;}
  .stats{display:flex;gap:22px;margin-top:15px;padding-top:13px;border-top:2px solid var(--border);}
  .stat-label{font-family:'JetBrains Mono',monospace;color:var(--steel);font-size:9px;letter-spacing:.1em;text-transform:uppercase;}
  .stat-value{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1.1;margin-top:2px;}
  .panel{background:var(--card);border-radius:5px;border-left:5px solid var(--line);padding:16px;margin-top:18px;box-shadow:0 1px 1px rgba(16,35,58,.04);}
  .panel.red{border-left-color:var(--red);}
  .panel.green{border-left-color:var(--green);}
  .panel.dark{background:var(--deep);color:#fff;border-left-color:var(--red);}
  .panel h2,.panel h3{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:0;}
  .panel h2{font-size:21px;}
  .panel h3{font-size:18px;}
  .panel p{font-size:14px;line-height:1.5;color:var(--steel);margin:8px 0 0;}
  .dark p{color:#C3D4E2;}
  .section-head{display:flex;align-items:baseline;gap:10px;margin:24px 0 9px;}
  .section-head h2{font-family:'Barlow Condensed',sans-serif;font-size:19px;color:var(--line);font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin:0;}
  .section-head .meta{margin-left:auto;color:var(--steel);font-family:'JetBrains Mono',monospace;font-size:11px;}
  .warmup{background:#fff;border-left:5px solid var(--red);border-radius:4px;padding:13px 15px;margin-top:17px;}
  .warmup h2{font-family:'Barlow Condensed',sans-serif;font-size:18px;margin:0;text-transform:uppercase;letter-spacing:.05em;}
  .warmup ul{padding-left:18px;margin:7px 0 0;color:#3E566E;font-size:14px;line-height:1.55;}
  .warmup .ramp{font-size:13px;color:var(--steel);margin-top:8px;}
  .exercise-card{background:var(--card);border-radius:5px;border-left:5px solid var(--line);margin:0 0 9px;overflow:hidden;box-shadow:0 1px 1px rgba(16,35,58,.04);}
  .exercise-card.key{border-left-color:var(--red);}
  .exercise-card.paired{box-shadow:0 0 0 2px #E9B447 inset;}
  .exercise-main{padding:14px 14px 12px;}
  .exercise-title-row{display:flex;gap:10px;align-items:flex-start;}
  .exercise-number{flex:0 0 auto;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#B5C4D0;padding-top:4px;}
  .key .exercise-number{color:var(--red);}
  .exercise-title{min-width:0;flex:1;}
  .exercise-title h3{font-family:'Barlow Condensed',sans-serif;font-size:22px;line-height:1.02;margin:0;font-weight:700;}
  .exercise-variant{font-size:13px;color:var(--steel);line-height:1.3;margin-top:2px;}
  .priority{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--red);border:1px solid #E8A6B2;border-radius:3px;padding:3px 4px;text-transform:uppercase;white-space:nowrap;}
  .priority.support{color:var(--steel);border-color:var(--border);}
  .three-numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:14px;border:1px solid var(--border);background:var(--border);border-radius:4px;overflow:hidden;}
  .number-box{background:#FBFCFD;padding:9px 8px;min-width:0;}
  .number-box.today{background:#F0F7F2;}
  .number-box .label{font-family:'JetBrains Mono',monospace;font-size:9px;line-height:1.1;letter-spacing:.07em;text-transform:uppercase;color:var(--steel);}
  .number-box.today .label{color:var(--green);}
  .number-box .number{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;line-height:1.05;color:var(--deep);margin-top:5px;overflow-wrap:anywhere;}
  .number-box.today .number{color:#1F5C3B;}
  .number-box .number.up{color:var(--green);}
  .number-box .number.down{color:var(--red);}
  .number-box .secondary{display:block;font-size:11px;line-height:1.25;color:var(--steel);margin-top:4px;overflow-wrap:anywhere;}
  .series-plan{margin-top:11px;background:#F6F9FB;border:1px solid var(--border);border-radius:4px;padding:9px;}
  .series-plan-head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;}
  .series-plan-head span{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--steel);letter-spacing:.08em;text-transform:uppercase;}
  .series-plan-head strong{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:17px;color:var(--deep);}
  .series-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
  .set-chip{background:#fff;border-radius:3px;padding:7px 5px;text-align:center;border-top:3px solid var(--line);}
  .set-chip.optional{border-top-color:var(--gold);background:#FFFCF6;}
  .set-chip span{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--steel);line-height:1.1;}
  .set-chip strong{display:block;font-family:'Barlow Condensed',sans-serif;font-size:16px;color:var(--deep);line-height:1.05;margin-top:4px;overflow-wrap:anywhere;}
  .set-chip small{display:block;color:var(--steel);font-size:10px;line-height:1.15;margin-top:3px;}
  .series-note{font-size:11px;color:var(--steel);margin-top:7px;}
  .log-form{display:flex;gap:7px;align-items:stretch;margin-top:11px;}
  .log-form input{min-width:0;flex:1;border:1px solid #C9D7E2;border-radius:3px;background:#fff;color:var(--deep);font-size:14px;padding:10px 10px;}
  .log-form input.note{flex:.65;}
  .primary-btn,.dark-btn,.outline-btn,.text-btn{border-radius:3px;border:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
  .primary-btn{background:var(--deep);color:#fff;padding:0 15px;font-size:15px;}
  .primary-btn:active,.dark-btn:active{opacity:.82;}
  .outline-btn{background:#fff;color:var(--deep);border:2px solid var(--deep);padding:10px 13px;font-size:14px;}
  .text-btn{background:transparent;color:var(--line);font-size:13px;padding:8px 0;text-transform:none;letter-spacing:0;}
  .exercise-actions{display:flex;flex-wrap:wrap;align-items:center;gap:4px 13px;margin-top:5px;}
  .pair-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--gold);}
  .technique{border-top:1px solid #E5ECF1;margin-top:9px;padding-top:8px;}
  .technique summary{cursor:pointer;color:var(--line);font-size:13px;font-weight:600;list-style:none;}
  .technique summary::-webkit-details-marker{display:none;}
  .technique summary:before{content:'+';display:inline-block;width:18px;font-family:'JetBrains Mono',monospace;font-weight:700;}
  .technique[open] summary:before{content:'−';}
  .tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .tech-item{background:var(--soft);border-radius:3px;padding:10px;}
  .tech-item h4{font-family:'JetBrains Mono',monospace;color:var(--steel);font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px;}
  .tech-item p{font-size:13px;line-height:1.45;color:#2A4056;margin:0;}
  .tech-item.warning{background:#FBF3EF;}
  .tech-item.warning p{color:#6B4A3E;}
  .tech-item.full{grid-column:1/-1;}
  .tech-link{display:inline-block;color:var(--line);font-size:13px;text-decoration:none;margin-top:10px;}
  .override-box{margin-top:10px;background:#F8F3E9;border-left:3px solid var(--gold);padding:9px;}
  .override-form{display:flex;gap:6px;margin-top:5px;}
  .override-form input{flex:1;min-width:0;border:1px solid #D8C394;padding:8px;border-radius:3px;font-size:13px;}
  .small-btn{border:0;background:var(--green);color:#fff;border-radius:3px;padding:7px 10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;font-size:13px;}
  .small-btn.alt{background:#fff;color:var(--gold);border:1px solid #D8C394;}
  .week-list{background:#fff;border-radius:4px;overflow:hidden;}
  .week-row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid #E6EDF2;min-height:62px;}
  .week-row:last-child{border-bottom:0;}
  .week-row.today{background:#F0F7F2;}
  .week-day{width:82px;flex:0 0 82px;font-family:'Barlow Condensed',sans-serif;color:#5F7E9E;font-weight:700;font-size:15px;text-transform:uppercase;line-height:1.1;}
  .week-row.today .week-day{color:var(--green);}
  .week-day small{display:block;font-family:'Barlow',sans-serif;color:var(--green);font-size:10px;margin-top:3px;}
  .week-copy{flex:1;min-width:0;}
  .week-copy strong{display:block;font-size:15px;color:#12293E;}
  .week-copy span{display:block;font-size:12.5px;color:var(--steel);line-height:1.35;margin-top:2px;}
  .week-open{background:transparent;color:var(--line);border:0;font-size:22px;padding:4px;}
  .plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:17px;}
  .plan-card{background:#fff;border:2px solid var(--border);border-radius:4px;padding:12px;text-align:left;}
  .plan-card.selected{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset;}
  .plan-card .plan-letter{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--red);font-weight:700;}
  .plan-card h3{font-family:'Barlow Condensed',sans-serif;font-size:20px;line-height:1.05;margin:5px 0 0;}
  .plan-card p{font-size:12px;color:var(--steel);line-height:1.35;margin:5px 0 0;}
  .plan-card .plan-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--steel);margin-top:9px;}
  .search-wrap{margin-top:16px;position:relative;}
  .search-wrap input{width:100%;border:2px solid var(--deep);border-radius:4px;padding:12px 13px 12px 38px;background:#fff;color:var(--deep);font-size:16px;}
  .search-icon{position:absolute;left:13px;top:12px;color:var(--steel);font-size:18px;}
  .progress-layout{display:grid;grid-template-columns:260px 1fr;gap:14px;margin-top:16px;align-items:start;}
  .progress-results{background:#fff;border-radius:4px;overflow:hidden;max-height:590px;overflow-y:auto;}
  .progress-result{width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #E7EDF2;padding:11px 12px;}
  .progress-result:hover{background:#F6F9FB;}
  .progress-result.selected{background:#EDF4FB;border-left:4px solid var(--line);padding-left:8px;}
  .progress-result strong{display:block;font-family:'Barlow Condensed',sans-serif;font-size:17px;line-height:1.05;color:var(--deep);}
  .progress-result span{display:block;font-size:11px;color:var(--steel);margin-top:3px;}
  .progress-result .inactive{color:var(--gold);}
  .progress-detail{min-width:0;}
  .progress-title{background:var(--deep);color:#fff;border-radius:4px;padding:15px;}
  .progress-title .eyebrow{color:#A4BDD2;}
  .progress-title h2{font-family:'Barlow Condensed',sans-serif;font-size:27px;line-height:1;margin:5px 0 0;}
  .progress-title p{font-size:13px;color:#BDD0DF;margin:4px 0 0;}
  .progress-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);margin-top:12px;border-radius:4px;overflow:hidden;}
  .metric{background:#fff;padding:11px 10px;}
  .metric .m-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--steel);text-transform:uppercase;letter-spacing:.06em;}
  .metric strong{font-family:'Barlow Condensed',sans-serif;font-size:21px;line-height:1.05;display:block;margin-top:5px;overflow-wrap:anywhere;}
  .chart-card{background:#fff;border-radius:4px;margin-top:10px;padding:12px;}
  .chart-card h3{font-family:'Barlow Condensed',sans-serif;font-size:17px;text-transform:uppercase;margin:0;}
  .chart-card svg{width:100%;height:180px;display:block;margin-top:8px;}
  .chart-empty{font-size:13px;color:var(--steel);padding:25px 0 13px;}
  .chart-footer{display:flex;justify-content:space-between;gap:8px;font-family:'JetBrains Mono',monospace;color:var(--steel);font-size:10px;}
  .history-card{background:#fff;border-radius:4px;margin-top:10px;padding:12px;}
  .history-card h3{font-family:'Barlow Condensed',sans-serif;font-size:17px;text-transform:uppercase;margin:0 0 6px;}
  .history-row{display:flex;align-items:flex-start;gap:10px;border-top:1px solid #E7EDF2;padding:10px 0;}
  .history-date{flex:0 0 86px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--steel);}
  .history-performance{flex:1;min-width:0;font-size:14px;color:#233B51;line-height:1.35;overflow-wrap:anywhere;}
  .history-performance small{display:block;color:var(--steel);font-size:11px;margin-top:3px;}
  .delete-btn{flex:0 0 auto;background:transparent;border:0;color:var(--red);font-size:11px;text-decoration:underline;padding:0;}
  .body-form{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;}
  .body-form input,.settings-form input{width:100%;min-width:0;border:1px solid #C9D7E2;border-radius:3px;padding:10px;font-size:14px;background:#fff;color:var(--deep);}
  .measurement-list{background:#fff;border-radius:4px;overflow:hidden;}
  .measurement-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px;border-bottom:1px solid #E7EDF2;font-size:14px;}
  .measurement-row:last-child{border-bottom:0;}
  .measurement-row .date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--steel);}
  .measurement-row .values{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;text-align:right;}
  .measurement-row .values small{font-family:'Barlow',sans-serif;font-size:11px;font-weight:400;color:var(--steel);}
  .info-table{width:100%;border-collapse:collapse;font-size:13px;}
  .info-table td{border-top:1px solid #2A435E;padding:8px 0;color:#C3D4E2;}
  .info-table td:last-child{text-align:right;color:#fff;font-family:'JetBrains Mono',monospace;font-size:11px;}
  .settings-form{display:grid;gap:9px;margin-top:13px;}
  .settings-form label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);}
  .settings-form .field{display:grid;gap:4px;}
  .settings-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;}
  .cloud-state{font-size:13px;padding:9px 11px;border-radius:3px;background:#F4F8FA;color:var(--steel);margin-top:12px;}
  .cloud-state.ok{background:#EAF4EE;color:#1F5C3B;}
  .cloud-state.warn{background:#FBF3EF;color:#7A4C29;}
  .file-input{display:none;}
  .empty{background:#fff;border-radius:4px;padding:17px;color:var(--steel);font-size:14px;}
  .notice{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:3px;margin-top:10px;background:#F0F5FA;color:#3E566E;border-left:3px solid var(--line);}
  .notice.warn{background:#FBF3EF;color:#6B4A3E;border-left-color:var(--red);}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;max-width:calc(100% - 36px);background:var(--deep);color:#fff;border-radius:4px;padding:11px 14px;font-size:13px;box-shadow:0 5px 20px rgba(0,0,0,.2);}
  .toast.ok{background:var(--green);}
  .toast.bad{background:#8A2E22;}
  .timer{position:fixed;right:14px;bottom:14px;z-index:30;background:var(--deep);color:#fff;border-radius:5px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;}
  .timer.done{background:var(--green);}
  .timer strong{font-family:'Barlow Condensed',sans-serif;font-size:25px;line-height:1;}
  .timer span{font-size:11px;color:#C2D3E0;}
  .timer button{background:transparent;border:1px solid #7893AA;color:#fff;border-radius:3px;padding:5px 7px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:12px;}
  @media(max-width:680px){
    .progress-layout{display:block;}
    .progress-results{max-height:none;display:flex;overflow-x:auto;margin-bottom:10px;}
    .progress-result{min-width:170px;border-right:1px solid #E7EDF2;border-bottom:0;}
    .progress-result.selected{border-left:0;border-bottom:4px solid var(--line);padding-bottom:7px;}
  }
  @media(max-width:480px){
    .page{padding-left:14px;padding-right:14px;}
    .topbar{padding-left:14px;padding-right:14px;}
    .nav-btn{padding-left:8px;padding-right:8px;}
    .page-head h1{font-size:31px;}
    .three-numbers{grid-template-columns:1fr 1fr 1fr;}
    .number-box{padding:8px 6px;}
    .number-box .number{font-size:16px;}
    .number-box .secondary{font-size:10px;}
    .series-grid{grid-template-columns:repeat(2,1fr);}
    .log-form{display:grid;grid-template-columns:1fr auto;}
    .log-form input.note{grid-column:1/-1;grid-row:1;}
    .log-form input:not(.note){grid-column:1;grid-row:2;}
    .log-form button{grid-column:2;grid-row:2;}
    .tech-grid{grid-template-columns:1fr;}
    .tech-item.full{grid-column:auto;}
    .body-form{grid-template-columns:1fr 1fr;}
    .body-form button{grid-column:1/-1;padding:10px;}
    .plan-grid{gap:6px;}
    .plan-card{padding:9px;}
    .plan-card h3{font-size:18px;}
  }
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

var STORAGE_KEY = 'david-treningy-v4';
var LEGACY_KEY = 'david-treningy-v3';
var PLAN_START_DATE = '2026-09-03';
var HEIGHT_DEFAULT = 183;
var currentView = 'today';
var selectedPlan = 'A';
var selectedExercise = 'bench_press';
var progressQuery = '';
var openOverrides = {};
var paired = {};
var toastState = null;
var timerState = {seconds:0, id:null, done:false};
var cloudState = {text:'Lokálne dáta', tone:'local', busy:false};
var syncTimer = null;

function makeExercise(id,name,variant,group,config){
  return Object.assign({
    id:id,

function uid(prefix){
  if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return (prefix||'id')+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
}

function readJSON(key){
  try{
    var raw=window.localStorage.getItem(key);
    return raw?JSON.parse(raw):null;
  }catch(e){return null;}
}

function writeState(value){
  try{window.localStorage.setItem(STORAGE_KEY,JSON.stringify(value));return true;}
  catch(e){return false;}
}

function escapeHTML(value){
  return String(value==null?'':value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function numberText(value){
  if(value==null || value==='') return '';
  return String(Math.round(Number(value)*10)/10).replace('.',',');
}

function isoToday(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function legacyDateToISO(value){
  var s=String(value||'');
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  var m=s.match(/(\d{1,2})\.\s*(\d{1,2})\.(?:\s*(\d{4}))?/);
  if(!m) return isoToday();
  var year=m[3]?Number(m[3]):new Date().getFullYear();
  var candidate=new Date(year,Number(m[2])-1,Number(m[1]));
  if(!m[3] && candidate.getTime()>Date.now()+31*24*3600*1000) year--;
  return year+'-'+String(Number(m[2])).padStart(2,'0')+'-'+String(Number(m[1])).padStart(2,'0');
}

function formatDate(value){
  var s=String(value||'');
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?Number(m[3])+'.'+Number(m[2])+'.'+m[1]:s;
}

function dateLong(value){
  var days=['Nedeľa','Pondelok','Utorok','Streda','Štvrtok','Piatok','Sobota'];
  var d=value?new Date(value+'T12:00:00'):new Date();
  return days[d.getDay()]+' · '+formatDate(value||isoToday());
}

function parsePerformance(raw, exercise){
  var text=String(raw||'').trim();
  var before=text.split('(')[0];
  var bodyweight=exercise && exercise.unit==='BW' || /vlastn|bodyweight|\bbw\b/i.test(before);
  var weight=null;
  var reps=[];
  if(bodyweight){
    var separator=before.indexOf('·');
    var repText=separator>=0?before.slice(separator+1):before;
    reps=(repText.match(/\d+/g)||[]).map(Number).filter(function(n){return n>0&&n<100;});
  }else{
    var wm=before.match(/(\d+(?:[.,]\d+)?)\s*kg?/i);
    if(wm){
      weight=Number(wm[1].replace(',','.'));
      var after=before.slice(wm.index+wm[0].length);
      reps=(after.match(/\d+/g)||[]).map(Number).filter(function(n){return n>0&&n<100;});
    }else{
      var nums=(before.match(/\d+(?:[.,]\d+)?/g)||[]);
      if(nums.length){
        weight=Number(nums[0].replace(',','.'));
        reps=nums.slice(1).map(function(n){return Number(n.replace(',','.'));}).filter(function(n){return n>0&&n<100;});
      }
    }
  }
  return {weight:Number.isFinite(weight)?weight:null,unit:bodyweight?'BW':'kg',reps:reps};
}

function parseDateForRecord(value){
  return /^\d{4}-\d{2}-\d{2}$/.test(String(value||''))?String(value):legacyDateToISO(value);
}

function normalizeRecord(value,exerciseId){
  var ex=EXERCISES[exerciseId]||EXERCISES.bench_press;
  if(value && value.v && !value.reps){
    var parsedLegacy=parsePerformance(value.v,ex);
    return {
      id:uid('log'),
      date:parseDateForRecord(value.d),
      weight:parsedLegacy.weight,
      unit:parsedLegacy.unit,
      reps:parsedLegacy.reps,
      note:value.p||'',
      updatedAt:new Date().toISOString()
    };
  }
  var weight=value && value.weight!=null && value.weight!==''?Number(value.weight):null;
  return {
    id:value&&value.id?String(value.id):uid('log'),
    date:parseDateForRecord(value&&value.date),
    weight:Number.isFinite(weight)?weight:null,
    unit:value&&value.unit?value.unit:(weight==null?'BW':'kg'),
    reps:Array.isArray(value&&value.reps)?value.reps.map(Number).filter(function(n){return n>0&&n<100;}):[],
    note:value&&value.note?String(value.note):'',
    updatedAt:value&&value.updatedAt?String(value.updatedAt):(value&&value.updated_at?String(value.updated_at):new Date().toISOString())
  };
}

function recordKey(record){
  return [record.date,record.weight==null?'BW':record.weight,record.unit,(record.reps||[]).join(','),record.note||''].join('|');
}

function addRecord(target,exerciseId,record){
  if(!target.logs[exerciseId]) target.logs[exerciseId]=[];
  var normalized=normalizeRecord(record,exerciseId);
  var duplicate=target.logs[exerciseId].some(function(existing){return recordKey(existing)===recordKey(normalized);});
  if(!duplicate) target.logs[exerciseId].push(normalized);
  target.logs[exerciseId].sort(function(a,b){return String(b.date).localeCompare(String(a.date))||String(b.updatedAt).localeCompare(String(a.updatedAt));});
}

function addMeasurement(target,value){
  var date=parseDateForRecord(value&&value.date||value&&value.d);
  var weight=Number(value&&value.weight!=null?value.weight:value&&value.w);
  var waist=Number(value&&value.waist!=null?value.waist:value&&value.p);
  if(!Number.isFinite(weight)||!Number.isFinite(waist)) return;
  var item={id:value&&value.id?String(value.id):uid('body'),date:date,weight:Math.round(weight*10)/10,waist:Math.round(waist*10)/10,updatedAt:value&&value.updatedAt?value.updatedAt:new Date().toISOString()};
  if(!target.measurements.some(function(x){return x.date===item.date&&x.weight===item.weight&&x.waist===item.waist;})) target.measurements.push(item);
}

function migrateLegacy(){
  var next=blankState();
  var old=readJSON(LEGACY_KEY);
  var oldOverrides=readJSON(LEGACY_KEY+'-prepis')||{};
  var oldBody=readJSON(LEGACY_KEY+'-telo')||[];
  if(old && typeof old==='object'){
    Object.keys(old).forEach(function(oldId){
      var newId=LEGACY_MAP[oldId];
      if(!newId || !Array.isArray(old[oldId])) return;
      old[oldId].forEach(function(item){addRecord(next,newId,item);});
    });
  }
  Object.keys(oldOverrides).forEach(function(oldId){
    var newId=LEGACY_MAP[oldId];
    if(newId && oldOverrides[oldId]) next.overrides[newId]=String(oldOverrides[oldId]);
  });
  if(Array.isArray(oldBody)) oldBody.forEach(function(item){addMeasurement(next,item);});
  return next;
}

function normalizeState(source){
  var next=blankState();
  if(source && typeof source==='object'){
    next.settings=Object.assign(next.settings,source.settings||{});
    next.overrides=Object.assign({},source.overrides||{});
    next.cloud=Object.assign(next.cloud,source.cloud||{});
    next.deleted=Object.assign(next.deleted,source.deleted||{});
    if(source.logs && typeof source.logs==='object'){
      Object.keys(source.logs).forEach(function(id){
        if(!EXERCISES[id]) return;
        if(Array.isArray(source.logs[id])) source.logs[id].forEach(function(record){addRecord(next,id,record);});
      });
    }
    var measurements=source.measurements||source.telo||[];
    if(Array.isArray(measurements)) measurements.forEach(function(item){addMeasurement(next,item);});
  }
  next.version=4;
  next.measurements.sort(function(a,b){return b.date.localeCompare(a.date);});
  return next;
}

function setsText(ex){
  if(ex.setsMin&&ex.setsMax&&ex.setsMin!==ex.setsMax) return ex.setsMin+'–'+ex.setsMax;
  return String(ex.sets||3);
}

function repsText(ex){
  if(ex.repMin===ex.repMax) return String(ex.repMin);
  return ex.repMin+'–'+ex.repMax;
}

function prescriptionText(ex){
  var suffix=ex.unit==='BW'?' na nohu':'';
  return setsText(ex)+' × '+repsText(ex)+(ex.prescriptionSuffix||suffix);

function extractWeight(value){
  var match=String(value||'').match(/(\d+(?:[.,]\d+)?)\s*kg/i);
  return match?Number(match[1].replace(',','.')):null;
}

function loadLabel(ex,weight){
  return numberText(weight)+' '+(ex.loadUnit||'kg');
}

function planLoadLabel(ex){
  if(ex.unit==='BW') return 'Vlastná váha';
  if(ex.planWeightLabel) return ex.planWeightLabel;
  var weight=ex.planWeight!=null?ex.planWeight:ex.startWeight;
  return Number.isFinite(Number(weight))?loadLabel(ex,Number(weight)):'Nastav prvú váhu';
}

function workingLoadLabel(ex,last,rec){
  if(ex.unit==='BW') return 'Vlastná váha';
  if(rec&&rec.tone==='plan') return planLoadLabel(ex);
  var recommended=extractWeight(rec&&rec.label);
  var weight=Number.isFinite(recommended)?recommended:
    last&&Number.isFinite(Number(last.weight))?Number(last.weight):
    ex.planWeight!=null?ex.planWeight:ex.startWeight;
  return Number.isFinite(Number(weight))?loadLabel(ex,Number(weight)):'Nastav prvú váhu';
}

function seriesPlanHtml(ex,last,rec){
  var minSets=ex.setsMin||ex.sets||3;
  var maxSets=ex.setsMax||ex.sets||3;
  var load=workingLoadLabel(ex,last,rec);
  var chips=[];
  for(var i=1;i<=maxSets;i++){
    chips.push('<div class="set-chip '+(i>minSets?'optional':'')+'"><span>'+i+'. séria'+(i>minSets?' · voliteľná':'')+'</span><strong>'+escapeHTML(load)+'</strong><small>'+escapeHTML(repsText(ex))+' op.</small></div>');
  }
  return '<div class="series-plan"><div class="series-plan-head"><span>Pracovné série · váha</span><strong>'+escapeHTML(load)+'</strong></div><div class="series-grid">'+chips.join('')+'</div><div class="series-note">Zapíš jednu pracovnú váhu a opakovania po sériách, napr. 60 kg · 8,8,8.</div></div>';
}

function performanceText(record,ex){
  if(!record) return '—';
  var weight=record.unit==='BW'||record.weight==null?'Vlastná váha':loadLabel(ex||{},record.weight);
  var reps=(record.reps||[]).length?record.reps.join(' / '):'bez opakovaní';
  return weight+' · '+reps;
}

function quality(record,ex){
  var reps=record&&Array.isArray(record.reps)?record.reps:[];
  var target=ex.setsMin||ex.sets||3;
  var used=reps.slice(0,target);
  return {
    complete:reps.length>=target,
    top:reps.length>=target&&used.every(function(rep){return rep>=ex.repMax;}),
    belowMin:used.some(function(rep){return rep<ex.repMin;}),
    total:used.reduce(function(a,b){return a+b;},0)
  };
}

function recommendation(ex){
  var manual=state.overrides[ex.id];
  if(manual) return {label:manual,detail:'Ručne upravené odporúčanie',tone:'manual'};
  var allLogs=getLogs(ex.id);
  var logs=allLogs.filter(function(record){return String(record.date)>=PLAN_START_DATE;});
  if(!logs.length){
    var plan=planLoadLabel(ex);
    if(plan!=='Nastav prvú váhu') return {label:plan,detail:'Aktuálna pracovná váha podľa tvojho plánu.',tone:'plan'};
    logs=allLogs;
  }
  var last=logs[0];
  if(!last) return {label:ex.unit==='BW'?'Vlastná váha':'Nastav štart',detail:'Prvý záznam nastav podľa čistej techniky.',tone:'new'};
  var q=quality(last,ex);
  if(ex.unit==='BW'){
    if(q.top&&ex.bodyweightProgression) return {label:ex.bodyweightProgression,detail:'Horný rozsah je splnený. Najprv však udrž techniku.',tone:'up'};
    return {label:'Vlastná váha',detail:q.complete?'Drž rozsah '+repsText(ex)+' v každej sérii.':'Dokonči '+setsText(ex)+' série bez straty pozície.',tone:'hold'};
  }
  var weight=Number(last.weight);
  if(!Number.isFinite(weight)) return {label:'Nastav štart',detail:'Zápis nemá rozpoznateľnú váhu.',tone:'new'};
  if(q.top) return {label:loadLabel(ex,weight+ex.increment),detail:'Horný rozsah je splnený vo všetkých sériách. Pridaj najmenší rozumný krok.',tone:'up'};
  var recent=logs.slice(0,3);
  var badCount=recent.filter(function(item){return quality(item,ex).belowMin||!quality(item,ex).complete;}).length;
  if(badCount>=2){
    var lower=Math.max(ex.increment,weight-ex.increment);
    return {label:loadLabel(ex,lower),detail:'Opakovaný prepad výkonu. Zníž o jeden krok a znovu vybuduj čisté série.',tone:'down'};
  }
  if(!q.complete||q.belowMin) return {label:loadLabel(ex,weight),detail:'Jeden slabší deň ešte nie je dôvod na zníženie. Drž váhu a dokonči predpis.',tone:'hold'};
  return {label:loadLabel(ex,weight),detail:'Si v rozsahu, ale ešte nie na jeho hornom konci. Drž váhu.',tone:'hold'};
}

function chartSVG(records,label,color){
  var points=records.filter(function(record){return record.weight!=null&&record.unit!=='BW';}).slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  if(points.length<2) return '<div class="chart-empty">Na graf treba aspoň dva váhové zápisy.</div>';
  var W=680,H=180,P=22;
  var values=points.map(function(record){return Number(record.weight);});
  var min=Math.min.apply(Math,values),max=Math.max.apply(Math,values),range=(max-min)||1;
  var coords=points.map(function(record,index){
    return [P+(index/(points.length-1))*(W-P*2),P+(1-(record.weight-min)/range)*(H-P*2)];
  });
  var line=coords.map(function(point,index){return (index?'L':'M')+point[0].toFixed(1)+' '+point[1].toFixed(1);}).join(' ');
  var area=line+' L '+coords[coords.length-1][0].toFixed(1)+' '+(H-P)+' L '+coords[0][0].toFixed(1)+' '+(H-P)+' Z';
  var dots=coords.map(function(point,index){return '<circle cx="'+point[0].toFixed(1)+'" cy="'+point[1].toFixed(1)+'" r="'+(index===coords.length-1?5:3.5)+'" fill="'+(index===coords.length-1?'#C8102E':color)+'"/>';}).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+escapeHTML(label)+'">'+
    '<line x1="'+P+'" y1="'+(H-P)+'" x2="'+(W-P)+'" y2="'+(H-P)+'" stroke="#DCE5EC"/>'+
    '<path d="'+area+'" fill="'+color+'" opacity=".10"/>'+
    '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linejoin="round"/>'+
    dots+
    '<text x="'+P+'" y="16" fill="#6F879D" font-size="12">'+numberText(max)+' kg</text>'+
    '<text x="'+P+'" y="'+(H-4)+'" fill="#6F879D" font-size="12">'+numberText(min)+' kg</text>'+
    '</svg>'+
    '<div class="chart-footer"><span>'+formatDate(points[0].date)+' → '+formatDate(points[points.length-1].date)+'</span><span>'+numberText(values[values.length-1]-values[0])+' kg</span></div>';
}

function renderWorkoutContent(program){

function progressMatches(id){
  var ex=EXERCISES[id];

  if(!query) return true;
  return (ex.name+' '+ex.variant+' '+ex.group+' '+ex.aliases).toLowerCase().indexOf(query)>=0;
}

function renderProgressResults(ids){

function renderBodyChart(measurements,key,label,color,unit){
  var records=measurements.filter(function(item){return item[key]!=null;}).slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  if(records.length<2) return '<div class="chart-empty">Na graf treba aspoň dve merania.</div>';
  var W=680,H=160,P=20,values=records.map(function(item){return Number(item[key]);}),min=Math.min.apply(Math,values),max=Math.max.apply(Math,values),range=(max-min)||1;
  var coords=records.map(function(item,index){return [P+(index/(records.length-1))*(W-P*2),P+(1-(item[key]-min)/range)*(H-P*2)];});
  var line=coords.map(function(point,index){return (index?'L':'M')+point[0].toFixed(1)+' '+point[1].toFixed(1);}).join(' ');
  var dots=coords.map(function(point,index){return '<circle cx="'+point[0].toFixed(1)+'" cy="'+point[1].toFixed(1)+'" r="'+(index===coords.length-1?5:3.5)+'" fill="'+(index===coords.length-1?'#C8102E':color)+'"/>';}).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+escapeHTML(label)+'"><path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linejoin="round"/>'+dots+'<text x="'+P+'" y="15" fill="#6F879D" font-size="12">'+numberText(max)+' '+unit+'</text><text x="'+P+'" y="'+(H-3)+'" fill="#6F879D" font-size="12">'+numberText(min)+' '+unit+'</text></svg><div class="chart-footer"><span>'+formatDate(records[0].date)+' → '+formatDate(records[records.length-1].date)+'</span><span>'+numberText(values[values.length-1]-values[0])+' '+unit+'</span></div>';
}

function render(){
  var content=currentView==='today'?renderToday():currentView==='progress'?renderProgress():currentView==='plan'?renderPlan():currentView==='body'?renderBody():currentView==='mobility'?renderMobility():renderSettings();
  document.getElementById('app').innerHTML=renderShell(content);

function showToast(text,tone){
  toastState={text:text,tone:tone||'ok'};
  render();
  window.clearTimeout(showToast.timer);
  showToast.timer=window.setTimeout(function(){toastState=null;render();},3500);
}

function saveLog(form){
  var id=form.getAttribute('data-exercise');
  var ex=EXERCISES[id];
  var raw=(form.elements.performance.value||'').trim();
  if(!raw){showToast('Napíš váhu a opakovania.','bad');return;}
  var parsed=parsePerformance(raw,ex);
  if(!parsed.reps.length){showToast('Nevidím opakovania. Použi napríklad 60 kg · 8,8,8.','bad');return;}
  if(ex.unit!=='BW'&&parsed.weight==null){showToast('Nevidím váhu. Použi napríklad 60 kg · 8,8,8.','bad');return;}
  addRecord(state,id,{id:uid('log'),date:isoToday(),weight:parsed.weight,unit:parsed.unit,reps:parsed.reps,note:(form.elements.note.value||'').trim(),updatedAt:new Date().toISOString()});
  persist();
  scheduleCloudSync();
  showToast('Zápis uložený.','ok');
}

function saveMeasurement(form){
  var weight=Number(String(form.elements.weight.value||'').replace(',','.'));
  var waist=Number(String(form.elements.waist.value||'').replace(',','.'));
  var date=form.elements.date.value||isoToday();
  if(!Number.isFinite(weight)||!Number.isFinite(waist)){showToast('Vyplň váhu aj pás.','bad');return;}
  addMeasurement(state,{id:uid('body'),date:date,weight:weight,waist:waist,updatedAt:new Date().toISOString()});
  state.measurements.sort(function(a,b){return b.date.localeCompare(a.date);});
  persist();
  scheduleCloudSync();
  showToast('Meranie uložené.','ok');
}

function exportData(){
  var payload={version:4,application:'Tréningy',exportedAt:new Date().toISOString(),logs:state.logs,measurements:state.measurements,overrides:state.overrides};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='treningy.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  showToast('Export obsahuje celú históriu.','ok');
}

function importData(file){
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      var imported=normalizeState(data);
      if(data&&Array.isArray(data.zaznamy)){
        data.zaznamy.forEach(function(item){
          var id=LEGACY_MAP[item.cvikId]||item.cvikId;
          if(!EXERCISES[id]) return;
          var raw=item.surovyZapis||(item.vaha!=null?item.vaha+' kg · '+(item.opakovania||[]).join(','):'vlastná váha · '+(item.opakovania||[]).join(','));
          addRecord(imported,id,{date:item.datumZobrazenie||item.datum, v:raw,p:item.poznamka||''});
        });
      }
      Object.keys(imported.logs).forEach(function(id){imported.logs[id].forEach(function(record){addRecord(state,id,record);});});
      imported.measurements.forEach(function(item){addMeasurement(state,item);});
      Object.assign(state.overrides,imported.overrides||{});
      persist();
      scheduleCloudSync();
      showToast('Import dokončený. Existujúce záznamy zostali zachované.','ok');
    }catch(e){showToast('Súbor sa nepodarilo načítať.','bad');}
  };
  reader.readAsText(file);
}

function deleteLog(id,recordId){
  if(!window.confirm('Zmazať tento tréningový zápis?')) return;
  if(!state.logs[id]) return;
  state.logs[id]=state.logs[id].filter(function(record){return record.id!==recordId;});
  if(!state.logs[id].length) delete state.logs[id];
  if(!state.deleted.logs) state.deleted.logs=[];
  state.deleted.logs.push(recordId);
  persist();scheduleCloudSync();showToast('Zápis zmazaný.','ok');
}

function deleteMeasurement(recordId){
  if(!window.confirm('Zmazať toto meranie?')) return;
  state.measurements=state.measurements.filter(function(item){return item.id!==recordId;});
  if(!state.deleted.measurements) state.deleted.measurements=[];
  state.deleted.measurements.push(recordId);
  persist();scheduleCloudSync();showToast('Meranie zmazané.','ok');
}

function startTimer(seconds){
  stopTimer();
  timerState={seconds:seconds,id:true,done:false};
  timerState.id=window.setInterval(function(){
    timerState.seconds--;
    if(timerState.seconds<=0){
      window.clearInterval(timerState.id);timerState.id=true;timerState.done=true;
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      render();
      window.setTimeout(stopTimer,4000);
    }else render();
  },1000);
  render();
}

function stopTimer(){
  if(timerState.id&&typeof timerState.id==='number') window.clearInterval(timerState.id);
  timerState={seconds:0,id:null,done:false};
  render();
}

function setCloudStatus(text,tone){
  cloudState.text=text;
  cloudState.tone=tone||'local';
}

function cloudConfigReady(){
  return state.cloud&&state.cloud.url&&state.cloud.anonKey&&state.cloud.session&&state.cloud.session.access_token;
}

function cloudBase(){
  return String(state.cloud.url||'').replace(/\/$/,'');
}

async function cloudRequest(path,options){
  var optionsSafe=options||{};
  var headers=Object.assign({'apikey':state.cloud.anonKey,'Authorization':'Bearer '+state.cloud.session.access_token,'Content-Type':'application/json'},optionsSafe.headers||{});
  var response=await fetch(cloudBase()+path,Object.assign({},optionsSafe,{headers:headers}));
  if(!response.ok){
    var text=await response.text();
    throw new Error(text||('HTTP '+response.status));
  }
  var content=await response.text();
  return content?JSON.parse(content):null;
}

async function cloudLogin(form,mode){
  var url=(form.querySelector('[name="url"]')||document.getElementById('cloud-url')).value.trim().replace(/\/$/,'');
  var anonKey=(form.querySelector('[name="anonKey"]')||document.getElementById('cloud-key')).value.trim();
  var email=(form.querySelector('[name="email"]')||document.getElementById('cloud-email')).value.trim();
  var password=(form.querySelector('[name="password"]')||document.getElementById('cloud-password')).value;
  if(!url||!anonKey||!email||!password){showToast('Vyplň URL, anon key, e-mail aj heslo.','bad');return;}
  setCloudStatus('Pripájam cloud…','warn');render();
  try{
    var path=mode==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';
    var response=await fetch(url+path,{method:'POST',headers:{apikey:anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})});
    var data=await response.json();
    if(!response.ok) throw new Error(data.msg||data.error_description||data.message||'Cloud prihlásenie zlyhalo.');
    state.cloud={url:url,anonKey:anonKey,session:data};
    persist();
    if(!data.access_token){
      setCloudStatus('Účet vytvorený. Potvrď e-mail a potom sa prihlás.','warn');
      showToast('Skontroluj potvrdzovací e-mail.','ok');
      render();
      return;
    }
    await syncCloud(true);
    setCloudStatus('Cloud synchronizovaný','cloud');
    showToast('Cloud je pripojený a dáta sú synchronizované.','ok');
    render();
  }catch(error){
    setCloudStatus('Cloud: '+(error.message||'chyba'),'warn');
    showToast('Cloud sa nepodarilo pripojiť. Skontroluj údaje a SQL tabuľky.','bad');
    render();
  }
}

function cloudRows(){
  var userId=state.cloud.session&&state.cloud.session.user&&state.cloud.session.user.id;
  var rows=[];
  Object.keys(state.logs).forEach(function(exerciseId){
    state.logs[exerciseId].forEach(function(record){
      rows.push({id:record.id,user_id:userId,exercise_id:exerciseId,date:record.date,weight:record.weight,unit:record.unit,reps:record.reps,note:record.note||'',updated_at:record.updatedAt});
    });
  });
  return rows;
}

function cloudBodyRows(){
  var userId=state.cloud.session&&state.cloud.session.user&&state.cloud.session.user.id;
  return state.measurements.map(function(item){return {id:item.id,user_id:userId,date:item.date,weight:item.weight,waist:item.waist,updated_at:item.updatedAt};});
}

async function pullCloud(){
  var remoteLogs=await cloudRequest('/rest/v1/training_entries?select=id,exercise_id,date,weight,unit,reps,note,updated_at&order=date.asc');
  var remoteBody=await cloudRequest('/rest/v1/body_measurements?select=id,date,weight,waist,updated_at&order=date.asc');
  var deletedLogs=(state.deleted&&state.deleted.logs)||[];
  var deletedBody=(state.deleted&&state.deleted.measurements)||[];
  (remoteLogs||[]).forEach(function(row){
    if(deletedLogs.indexOf(row.id)>=0) return;
    if(!EXERCISES[row.exercise_id]) return;
    var local=(state.logs[row.exercise_id]||[]).find(function(record){return record.id===row.id;});
    var remote=normalizeRecord({id:row.id,date:row.date,weight:row.weight,unit:row.unit,reps:row.reps,note:row.note,updated_at:row.updated_at},row.exercise_id);
    if(!local){addRecord(state,row.exercise_id,remote);}
    else if(String(remote.updatedAt)>String(local.updatedAt)){
      state.logs[row.exercise_id]=state.logs[row.exercise_id].map(function(record){return record.id===row.id?remote:record;});
    }
  });
  (remoteBody||[]).forEach(function(row){
    if(deletedBody.indexOf(row.id)>=0) return;
    var local=state.measurements.find(function(item){return item.id===row.id;});
    var remote={id:row.id,date:row.date,weight:Number(row.weight),waist:Number(row.waist),updatedAt:row.updated_at};
    if(!local) state.measurements.push(remote);
    else if(String(remote.updatedAt)>String(local.updatedAt)) state.measurements=state.measurements.map(function(item){return item.id===row.id?remote:item;});
  });
  state.measurements.sort(function(a,b){return b.date.localeCompare(a.date);});
  persist();
}

async function pushCloud(){
  var logs=cloudRows(),body=cloudBodyRows();
  if(logs.length) await cloudRequest('/rest/v1/training_entries?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(logs)});
  if(body.length) await cloudRequest('/rest/v1/body_measurements?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(body)});
  var deletedLogs=(state.deleted&&state.deleted.logs)||[];
  var deletedBody=(state.deleted&&state.deleted.measurements)||[];
  if(deletedLogs.length) await cloudRequest('/rest/v1/training_entries?id=in.('+deletedLogs.map(encodeURIComponent).join(',')+')',{method:'DELETE',headers:{Prefer:'return=minimal'}});
  if(deletedBody.length) await cloudRequest('/rest/v1/body_measurements?id=in.('+deletedBody.map(encodeURIComponent).join(',')+')',{method:'DELETE',headers:{Prefer:'return=minimal'}});
  state.deleted={logs:[],measurements:[]};
  persist();
}

async function syncCloud(silent){
  if(!cloudConfigReady()||cloudState.busy) return;
  cloudState.busy=true;
  if(!silent){setCloudStatus('Synchronizujem…','warn');render();}
  try{
    await pullCloud();
    await pushCloud();
    setCloudStatus('Cloud synchronizovaný','cloud');
    if(!silent) showToast('Synchronizácia hotová.','ok');
  }catch(error){
    setCloudStatus('Cloud chyba, lokálne dáta sú zachované','warn');
    if(!silent) showToast('Cloud synchronizácia zlyhala, lokálne dáta zostali.','bad');
  }
  render();
}

function scheduleCloudSync(){
  if(!cloudConfigReady()) return;
  window.clearTimeout(syncTimer);
  syncTimer=window.setTimeout(function(){syncCloud(true);},900);
}

document.addEventListener('click',function(event){
  var viewButton=event.target.closest('[data-view]');
  if(viewButton){
    var view=viewButton.getAttribute('data-view');
    if(view==='plan'&&viewButton.getAttribute('data-plan')) selectedPlan=viewButton.getAttribute('data-plan');
    currentView=view;
    render();
    return;
  }
  var planButton=event.target.closest('[data-plan]');
  if(planButton){
    selectedPlan=planButton.getAttribute('data-plan');
    currentView='plan';
    render();
    return;
  }
  var progressButton=event.target.closest('[data-progress-exercise]');
  if(progressButton){
    selectedExercise=progressButton.getAttribute('data-progress-exercise');
    render();
    return;
  }
  var action=event.target.closest('[data-action]');
  if(!action) return;
  var type=action.getAttribute('data-action');
  var id=action.getAttribute('data-exercise');
  if(type==='toggle-pair'){paired[id]=!paired[id];render();}
  if(type==='toggle-override'){openOverrides[id]=!openOverrides[id];render();}
  if(type==='reset-override'){delete state.overrides[id];persist();render();}
  if(type==='delete-log'){deleteLog(id,action.getAttribute('data-record'));}
  if(type==='delete-measurement'){deleteMeasurement(action.getAttribute('data-record'));}
  if(type==='export'){exportData();}
  if(type==='import'){document.getElementById('import-file').click();}
  if(type==='sync'){syncCloud(false);}
  if(type==='logout'){state.cloud.session=null;persist();setCloudStatus('Lokálne dáta','local');render();}
  if(type==='stop-timer'){stopTimer();}
});

document.addEventListener('submit',function(event){
  if(event.target.matches('[data-log-form]')){event.preventDefault();saveLog(event.target);}
  if(event.target.matches('[data-measurement-form]')){event.preventDefault();saveMeasurement(event.target);}
  if(event.target.matches('[data-override-form]')){
    event.preventDefault();
    var id=event.target.getAttribute('data-exercise'),value=(event.target.elements.value.value||'').trim();
    if(value) state.overrides[id]=value; else delete state.overrides[id];
    persist();openOverrides[id]=false;showToast('Odporúčanie upravené.','ok');
  }
  if(event.target.matches('[data-height-form]')){
    event.preventDefault();
    var height=Number(event.target.elements.height.value);
    if(height>=100&&height<=230){state.settings.height=height;persist();showToast('Výška uložená.','ok');}
  }
  if(event.target.matches('[data-cloud-form]')){
    event.preventDefault();
    var mode=event.submitter&&event.submitter.value||'login';
    cloudLogin(event.target,mode);
  }
});

document.addEventListener('input',function(event){
  if(event.target.id==='progress-search'){
    progressQuery=event.target.value;
    var position=event.target.selectionStart;
    render();
    var input=document.getElementById('progress-search');
    if(input){input.focus();input.setSelectionRange(position,position);}
  }
});

document.addEventListener('change',function(event){
  if(event.target.id==='import-file'){
    importData(event.target.files&&event.target.files[0]);
    event.target.value='';
  }
});

render();
if(cloudConfigReady()) syncCloud(true);
</script>
</body>
</html>
